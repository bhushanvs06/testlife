<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete HTML Button Examples</title>
    <style>
        /* Base page styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px;
            background-color: #f8f9fa;
            color: #333;
        }

        h2 {
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 8px;
            margin-top: 30px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        /* 1. Custom styled button class */
        .btn-primary {
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* 2. Custom styled link button class */
        .btn-link {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .btn-link:hover {
            background-color: #218838;
        }

        /* 3. Disabled button style override */
        button:disabled {
            background-color: #6c757d !important;
            opacity: 0.65;
            cursor: not-allowed;
            transform: none !important;
        }
    </style>
</head>
<body>

    <h1>HTML Button Showcase</h1>

    <!-- SECTION 1: Standard Buttons -->
    <h2>1. General Interaction Buttons</h2>
    <div class="button-group">
        <!-- Styled Button -->
        <button type="button" class="btn-primary">Standard Button</button>
        
        <!-- Disabled Button -->
        <button type="button" class="btn-primary" disabled>Disabled Button</button>
    </div>

    <!-- SECTION 2: Navigation Link Styled as a Button -->
    <h2>2. Navigation Button (Link)</h2>
    <div class="button-group">
        <a href="https://example.com" target="_blank" class="btn-link">Go to Example.com</a>
    </div>

    <!-- SECTION 3: JavaScript Action Button -->
    <h2>3. JavaScript Interactive Button</h2>
    <div class="button-group">
        <button type="button" class="btn-primary" onclick="showAlert()">Trigger Alert</button>
    </div>

    <!-- JavaScript code to power the interaction above -->
    <script>
        function showAlert() {
            alert('Success! The button click event was captured.');
        }
    </script>

</body>
</html>
